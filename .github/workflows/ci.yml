name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile active modules
        run: python -m py_compile Corpus.py GloVe.py lower_tokenizer.py train_model.py try.py color_docx.py extend_docx.py
      - name: Regression tests
        run: python -m pytest -q
      - name: Bundled example
        run: python train_model.py --epochs 2 --output artifacts/ci
