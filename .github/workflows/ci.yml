name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive exact source
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - name: Run checks when configured
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
            python -m pytest -q
          fi
      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-source
          path: source.tar.gz
          retention-days: 1
