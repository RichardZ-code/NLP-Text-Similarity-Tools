name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q -x '/\.git/' .
      - name: Run regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Run self-contained example
        run: python train_model.py --seed 42 --output artifacts
      - name: Record tested source
        if: always()
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-${{ matrix.os }}
          path: |
            source.tar.gz
            test-results.xml
            artifacts/summary.json
          retention-days: 7
