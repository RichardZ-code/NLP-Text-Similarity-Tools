name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q Corpus.py GloVe.py lower_tokenizer.py train_model.py color_docx.py extend_docx.py try.py
      - name: Run regression suite
        run: python -m pytest -q
      - name: Run bundled example
        run: python train_model.py --output artifacts/ci-demo
